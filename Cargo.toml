[package]
name = "axum-learn"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version = "1",features = ["derive"]}
serde_json = "1.0"
serde_with = "2"
tokio = { version = "1.0", features = ["full"] }
axum = "0.6"
tower-http = {version = "0.4", features = ["fs"]}
tower-cookies = "0.9"
#Other dependencies
lazy-regex = "2"
async-trait = "0.1"
strum_macros = "0.24"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
chrono = "0.4.24"

[dev-dependencies]
anyhow = "1.0"
httpc-test = "0.1.1"  # test HTTP client, only used by tests/quick_dev.rs
